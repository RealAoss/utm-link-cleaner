<!doctype html><html lang="en" data-id="utm-link-cleaner"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracking Parameter Cleaner</title><style>:root{--accent:#304e78}
*{box-sizing:border-box}body{margin:0;background:#eff2ee;color:#1e2f30;font:16px/1.55 system-ui,sans-serif}main{max-width:920px;margin:5vh auto;background:#fff;border-top:7px solid var(--accent);padding:clamp(20px,5vw,52px)}h1{font:700 clamp(30px,5vw,52px)/1.08 Georgia,serif;letter-spacing:-.035em;margin:0 0 14px}p{max-width:70ch}label{display:block;font-weight:600;margin:12px 0}input,textarea{display:block;width:100%;font:inherit;padding:10px;border:1px solid #718786;border-radius:4px}textarea{resize:vertical}button{padding:10px 17px;background:var(--accent);border:0;border-radius:4px;color:white;font:inherit;cursor:pointer;margin:6px 4px 6px 0}button:disabled{opacity:.5}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #986522;outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:4px 18px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f5f3;padding:20px;font:inherit;border-left:4px solid var(--accent)}#problem{color:#90250e}#problem:empty{display:none}@media print{body,main{background:white;margin:0;padding:0;border:0;max-width:none}form,button,#problem{display:none}pre{border:0;padding:0;background:white}}
</style></head><body><main>
<h1>Tracking Parameter Cleaner</h1><p>Remove common campaign parameters from HTTP links while preserving the other query parameters.</p><form id="entry" onsubmit="return false"><label>One HTTP or HTTPS URL per line<textarea id="source" rows="8">https://example.org/article?id=3&amp;utm_source=news#read</textarea></label></form>
<p id="problem" role="alert"></p><pre id="result" aria-live="polite"></pre><button id="save">Download result</button><button id="print">Print result</button>
</main><script>'use strict';
const $=id=>document.getElementById(id);
function fail(message){throw new Error(message)}
function download(text){const u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=document.documentElement.dataset.id+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function refresh(){try{const value=compute();$('result').textContent=value;$('result').hidden=false;$('problem').textContent='';$('save').disabled=false;$('print').disabled=false}catch(e){$('result').textContent='';$('result').hidden=true;$('problem').textContent=e.message;$('save').disabled=true;$('print').disabled=true}}
$('entry').addEventListener('input',refresh);$('save').onclick=()=>download($('result').textContent);$('print').onclick=()=>window.print();


const lines=s=>s.split(/\r?\n/).map(v=>v.trim()).filter(Boolean);
const csv=v=>/[,"\r\n]/.test(v)?'"'+v.replaceAll('"','""')+'"':v;
function compute(){const s=$('source').value;if(!s.trim())fail('Enter some source text.');
return lines(s).map(l=>{const u=new URL(l);if(!['http:','https:'].includes(u.protocol))fail('Expected HTTP links');for(const k of [...u.searchParams.keys()])if(/^utm_/i.test(k)||['fbclid','gclid','msclkid'].includes(k.toLowerCase()))u.searchParams.delete(k);return u.href}).join('\n')
}
refresh();</script></body></html>
